spring:
  application:
    name: backend

  # Database Configuration (credentials from environment variables)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:blog_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # JWT Configuration (issuer pinned per profile)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER}

  servlet:
    multipart:
      enabled: true
      max-file-size: 16MB
      max-request-size: 20MB

  # OpenAI Config, used for AI translation
  ai:
    openai:
      api-key: ${OPENAI_APIKEY}
      base-url: ${OPENAI_BASEURL}
      timeout: 100s
      chat:
        model: ${OPENAI_MODEL}
        max-tokens: 16384

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 10s

storage:
  s3:
    endpoint: ${S3_ENDPOINT}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    region: ${S3_REGION:us-east-1}
    path-style: ${S3_PATH_STYLE:true}

resilience4j:
  retry:
    instances:
      fetchCloudflareStatistics:
        maxAttempts: 3
        waitDuration: 10s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.lang.Exception
        ignoreExceptions: []

application:
  # JWT Configuration
  security:
    jwt:
      audience: blog-spring
      client-id: blog

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://blog.arorms.cn,http://localhost:5174}

  # Cloudflare Configuration, used for view statistics query
  cloudflare:
    zone-id: ${CLOUDFLARE_ZONE_ID}
    token: ${CLOUDFLARE_TOKEN}

server:
  port: ${SERVER_PORT:8083}
